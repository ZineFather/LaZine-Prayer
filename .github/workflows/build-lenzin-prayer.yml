name: Build LaZine Prayer APK

concurrency:
  group: lazine-prayer-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Add CC0 Adhan audio asset
        run: |
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/b/b0/Beautiful_adhan.ogg" -o app/src/main/res/raw/adhan-source.ogg
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffmpeg -y -i app/src/main/res/raw/adhan-source.ogg -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a libvorbis -q:a 6 app/src/main/res/raw/adhan.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Call_to_prayer_by_Sabah_Fakhry.mp3" -o app/src/main/res/raw/sabah-source.mp3
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Adhan_-_Muslim_Call_to_Prayer_-_Aaqib_Azeez.mp3" -o app/src/main/res/raw/aqib-source.mp3
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Azan.ogg" -o app/src/main/res/raw/andrewler-source.ogg
          ffmpeg -y -i app/src/main/res/raw/sabah-source.mp3 -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a libvorbis -q:a 6 app/src/main/res/raw/adhan_sabah.ogg
          ffmpeg -y -i app/src/main/res/raw/aqib-source.mp3 -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a libvorbis -q:a 6 app/src/main/res/raw/adhan_aqib.ogg
          ffmpeg -y -i app/src/main/res/raw/andrewler-source.ogg -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a libvorbis -q:a 6 app/src/main/res/raw/adhan_andrewler.ogg
          rm app/src/main/res/raw/adhan-source.ogg app/src/main/res/raw/sabah-source.mp3 app/src/main/res/raw/aqib-source.mp3 app/src/main/res/raw/andrewler-source.ogg

      - name: Restore stable APK signing key
        id: stable-signing
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lazine-prayer-debug-signing-v1

      - name: Create stable APK signing key (first build only)
        if: steps.stable-signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=LaZine Prayer,C=EG"

      - name: Build Android 7 and modern APKs
        run: |
          gradle :app:assembleLegacyDebug :app:assembleModernDebug
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d '"' -f2)
          test -n "$VERSION"
          mkdir -p release
          LEGACY_APK=$(find app/build/outputs/apk/legacy/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          MODERN_APK=$(find app/build/outputs/apk/modern/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$LEGACY_APK"
          test -n "$MODERN_APK"
          cp "$LEGACY_APK" "release/LaZinePrayer-Android7-Legacy-${VERSION// /-}.apk"
          cp "$MODERN_APK" "release/LaZinePrayer-Modern-${VERSION// /-}.apk"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION// /-}-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LaZine Prayer ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            release/LaZinePrayer-Android7-Legacy-${{ env.APP_VERSION }}.apk
            release/LaZinePrayer-Modern-${{ env.APP_VERSION }}.apk
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🇪🇬 التغييرات
            الإصدار يحتوي على ملفين:
            - **Android 7 Legacy:** للأجهزة التي تعمل بنظام Android 7.0 أو 7.1 (API 24–25).
            - **Modern:** للأجهزة التي تعمل بنظام Android 8.0 أو أحدث (API 26+).

            ## 🇬🇧 What's changed
            This release includes two APKs:
            - **Android 7 Legacy:** for Android 7.0 and 7.1 devices (API 24–25).
            - **Modern:** for Android 8.0 and newer (API 26+).

            ---
            **APK فقط مرفق كملف إصدار.** كود المصدر متاح من قسم **Source code** الذي ينشئه GitHub تلقائيًا.
            **Only the APK is attached as a release asset.** Source code is available through GitHub's automatically generated **Source code** archives.
          fail_on_unmatched_files: true
