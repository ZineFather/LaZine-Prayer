name: Build Lenzin Prayer APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Add CC0 Adhan audio asset
        run: |
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/e/e7/Adhan.ogg" -o app/src/main/res/raw/adhan.ogg
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LenzinPrayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
